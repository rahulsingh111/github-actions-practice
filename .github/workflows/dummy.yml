name: secret-show
on:
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - name: read the secret
              env:
                MY_SECRET_MESSAGE: ${{secrets.MY_SECRET_MESSAGE}} 
              run: |
                if [ -n "$MY_SECRET_MESSAGE"]; then
                    echo "secret is set: true"
                else
                    echo "secret is set: false"
                fi

            - name: test secret masking
              run: echo "${{secrets.MY_SECRET_MESSAGE}}"

            - name: Generate test report
              run: |
                echo "Test Report" > test-report.txt
                echo "================" >> test-report.txt
                echo "Build: SUCCESS" >> test-report.txt
                echo "Tests: 10 passed" >> test-report.txt
                echo "Date: $(date)" >> test-report.txt

            - name: Upload test report
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: test-report.txt

    use-artifact:
        runs-on: ubuntu-latest
        needs: generate
        steps:
            - name: download artifact
              uses: actions/download-artifact@v4
              with:
                name: test-report

            - name: print artifact content
              run: |
                echo "contents are:"
                cat test-report.txt
                            
