name: multi-job
on:
    push:
        branches:
            - main
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: printing
              run: echo "building the app"
    
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: printing test
              run: echo "running tests"

    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: printing deploy
              run: echo "deploying"