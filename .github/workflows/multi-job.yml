name: multi-job
on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    APP_NAME: myapp
jobs:
    build:
        runs-on: ubuntu-latest
        env: 
            ENVIRONMENT: staging
        steps:
            - name: printing
              env:
                VERSION: 1.0.0
              run: echo "building the app"
    
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: printing test
              run: echo "running tests"

    deploy:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: printing deploy
              run: echo "deploying"